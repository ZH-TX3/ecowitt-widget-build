# XcodeGen 工程描述：用来在没有 Xcode 手工操作的情况下产出 EcowittWidget.appex
#
# 用途：在任意一台 macOS（云 Mac / CI runner / 同事的机器）上执行
#     ./scripts/build-appex.sh
# 就会自动生成 Xcode 工程、无签名编译 widget target、把产物塞进 uts 插件目录并同步版本号。
#
# 手工在 Xcode 里建 target 的那套流程（SETUP.md）依然有效，两条路产出同一个 .appex，二选一。

name: EcowittWidgetShell

# 最低系统版本只写在这里，target 级别不再覆盖（之前 settings.base 里也写了一份，
# 那份会盖掉这里，改一处不生效，已经删掉）。
#
# 取 15.0 而不是 14.0：
#   - 14.0 上 Text.monospacedDigit() / Grid / .font(.system(...).monospacedDigit())
#     这些都要逐处 #available 兜一层，写起来碎且容易漏（上一次 CI 就栽在
#     Text.monospacedDigit() 是 iOS 15 扩展专用上）。
#   - 这套设计真正需要的上限是 containerBackground（iOS 17），那处已经单独做了
#     #available 降级，所以 15.0 不会漏掉什么能力。
#   - 扩展的最低版本高于宿主 App 是允许的：低于 15 的系统上小组件不出现，
#     App 本身完全不受影响。
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

# 版本号只写在这里，target 级别不覆盖（对应 SETUP.md 里"写在 Project 级别"那条建议）
# build-appex.sh 会自动用 manifest.json 的值覆盖
settings:
  base:
    MARKETING_VERSION: "1.1.75"
    CURRENT_PROJECT_VERSION: "11075"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  # 壳工程：唯一作用是让 widget extension 有个合法的宿主，产物不参与 uni-app 打包
  EcowittShell:
    type: application
    platform: iOS
    sources:
      - path: Shell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.ecowitt
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: EcowittShell
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
    dependencies:
      - target: EcowittWidget
        embed: true

  # 真正要的东西
  EcowittWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EcowittWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ost.testecowittapp.widget
        INFOPLIST_FILE: EcowittWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: EcowittWidget/EcowittWidget.entitlements
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
