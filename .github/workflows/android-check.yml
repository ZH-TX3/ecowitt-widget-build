# Android 端本地校验的 CI 版本：在干净的 ubuntu runner 上编 Kotlin、链资源。
# 逻辑与 script/check_android_build.py 完全一致（同一份脚本，避免两套判断标准）。
#
# 手动触发：
#   gh workflow run android-check.yml -R <owner>/<repo>
# 或由 script/build_appex_ci.py --android 自动触发。

name: Android widget check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - "script/check_android_build.py"
      - ".github/workflows/android-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # runner 默认 JDK 可能过新（实测 25），kotlinc 的 JavaVersion 解析会直接抛异常，必须锁定
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Toolchain
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" || true

      # runner 自带的镜像是 x64 SDK；kotlinc 需要单独装（用官方 release，版本固定便于复现）
      # 镜像里 platforms / build-tools 可能不全，缺了就补一份（幂等）
      - name: Ensure SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "$SDK"
          if [ ! -d "$SDK/build-tools" ] || [ -z "$(ls -A "$SDK/build-tools" 2>/dev/null)" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" >/dev/null
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.0.21
          curl -sSL -o /tmp/kotlin.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlin.zip -d "$HOME"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
          "$HOME/kotlinc/bin/kotlinc" -version

      - name: Run shared check script
        run: |
          set -euo pipefail
          python3 script/check_android_build.py --verbose

      - name: UTS entry sanity (can't compile, only shape check)
        run: |
          set -euo pipefail
          f=app-android/index.uts
          test -f "$f"
          grep -q "export const pushWidgetData" "$f"
          grep -q "export const reloadWidget" "$f"
          grep -q "export const readWidgetData" "$f"
          echo "index.uts 导出齐全（uts → Kotlin 的转换只有 HBuilderX 能做，这里只做形状检查）"
